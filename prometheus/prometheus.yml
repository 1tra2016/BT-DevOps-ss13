global:
  scrape_interval: 15s

scrape_configs:

  # 1. Theo dõi Spring Boot user-service
  - job_name: 'backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  # 2. Theo dõi máy chủ Linux thông qua Node Exporter
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']